name: App checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-checks:
    name: App checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-11-10
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, verified 2026-11-10
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Match npm version
        run: npm install --global npm@11.17.0
      - name: Verify tool versions
        run: |
          node -e "if (process.versions.node !== require('./package.json').engines.node) process.exit(1)"
          expected_npm=$(node -p "require('./package.json').engines.npm")
          test "$(npm --version)" = "$expected_npm"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check TypeScript
        run: npm run typecheck
      - name: Check lint
        run: npm run lint
      - name: Run learning and storage tests
        run: npm test
      - name: Check Expo package compatibility
        run: npm run check:dependencies
      - name: Export Android JavaScript and assets
        run: npm run export:android
      - name: Audit dependencies (fail on high or critical)
        run: npm audit --audit-level=high
